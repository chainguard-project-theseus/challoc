# SmartHeap's sh6bench and sh8bench (sources fetched by bench/build.sh)
# on twice the CPUs.
[row.sh6benchN]
cmd = ["{bin}/sh6bench", "{nproc2}"]
parser = "wall"
unit = "s"
better = "lower"
threads = 0
class = "mt"
fixed_work = true
needs = ["{bin}/sh6bench"]
est_s = 4

[row.sh8benchN]
cmd = ["{bin}/sh8bench", "{nproc2}"]
parser = "wall"
unit = "s"
better = "lower"
threads = 0
class = "mt"
fixed_work = true
needs = ["{bin}/sh8bench"]
est_s = 6

# glibc's bench-malloc-thread: 2 s of random 4..32768-byte malloc/free per
# thread; scored by the iterations it counts.
[row.glibc-thread]
cmd = ["{bin}/glibc-thread", "{nproc}"]
parser = "regex"
pattern = '^(\d+) iterations'
unit = "iterations"
better = "higher"
threads = 0
class = "mt"
est_s = 3

