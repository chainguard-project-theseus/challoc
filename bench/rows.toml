# False sharing: objects allocated by one thread, written by others
# (cache-scratch: passed to the threads; cache-thrash: each thread its own).
# The N rows run 20000 iterations instead of mimalloc-bench's 1000, which
# finish in 30..50 ms on 16..32 threads (process start-up would dominate).
[row.cache-scratch1]
cmd = ["{bin}/cache-scratch", "1", "1000", "1", "2000000", "{nproc}"]
parser = "wall"
unit = "s"
better = "lower"
threads = 1
class = "st"
fixed_work = true
est_s = 3

[row.cache-scratchN]
cmd = ["{bin}/cache-scratch", "{nproc}", "20000", "1", "2000000", "{nproc}"]
parser = "wall"
unit = "s"
better = "lower"
threads = 0
class = "mt"
fixed_work = true
est_s = 3

[row.cache-thrash1]
cmd = ["{bin}/cache-thrash", "1", "1000", "1", "2000000", "{nproc}"]
parser = "wall"
unit = "s"
better = "lower"
threads = 1
class = "st"
fixed_work = true
est_s = 3

[row.cache-thrashN]
cmd = ["{bin}/cache-thrash", "{nproc}", "20000", "1", "2000000", "{nproc}"]
parser = "wall"
unit = "s"
better = "lower"
threads = 0
class = "mt"
fixed_work = true
