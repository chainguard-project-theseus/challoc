# bench/rows.toml: every row bench/cb can run (bench/README.md, "cb").
#
# A row is one program run as a fresh process under bench/tools/rt with the
# variant's library in LD_PRELOAD (nothing for glibc) and its MALLOC_CONF.
# Ported from bench/lib.sh (bench_args, ops_of, unit_of, higher_is_better,
# secs_of); the shell harnesses keep their own copy until they are retired.
#
# Fields:
#   cmd        argv; {name} is replaced from [vars], the command line's
#              --var name=value, and the built-ins {bin} (the mimalloc-bench
#              programs, target/bench-bin), {tools} (cb's own helpers,
#              target/cb/tools), {root} (the repository) and {nproc},
#              {nproc16} (nproc capped at 16)
#   env        extra environment for the program
#   parser     how the score is read (bench/cb/rows.py PARSERS): larson,
#              xmalloc, valkey_model.write, churn.occ, wall
#   unit, better ("higher" | "lower"), threads
#   class      st | mt | server | soak: picks the practical threshold delta
#              from [class] (the verdict margin until A/A calibration exists)
#   fixed_work true when the program does a fixed amount of work (its
#              instruction count is comparable run to run)
#   secs       the fixed duration of a throughput row (for ops)
#   ops        a fixed operation count (wall-time rows), for per-op counters
#   requires   variant properties the row needs: "mallctl" (challoc or
#              jemalloc), "challoc" (challoc builds only); other variants
#              skip the row
#   check      a hard floor on the score for challoc variants (a failed
#              check makes the row "broken"), e.g. { min = 90 }
#   est_s      expected seconds per run (planning, shard packing, timeouts);
#              the quick rows are the median wall time on the C4/C4A cells
#              (cb launch, 2026-09-30) plus process start
#   needs      files that must exist ({...} expanded) or the row is skipped
#
# Driver rows (kind = "soak" or "driver"): a script under bench/drivers/
# runs once per run with the variant in its environment (CB_ALLOC
# challoc|jemalloc|glibc|..., CB_LIB the library, CB_CONF its MALLOC_CONF,
# CB_OUT a scratch directory) plus the row's env, and writes its figures as
# JSON lines {"metrics": {name: number}} to RESULT_JSONL (bench/README.md,
# "Drivers"). Fields:
#   driver     the script, relative to bench/
#   metric     the figure that is the row's score (unit, better as above)
#   metrics    more figures, each compared as a row of its own named
#              <row>.<name>: [{ name, unit, better, class }]
#   features   cargo features of the challoc build the row needs (quantum8,
#              jemalloc-soname); every challoc variant is built with them
#   allocs     the variant sources the driver supports (challoc, jemalloc,
#              glibc, ...); other variants skip the row
#   placement  paired (default: ABBA on every VM) or one-variant-per-vm
#              (cb launch gives each (variant, replicate) a VM of its own,
#              one block, compared unpaired with Welch's t on the log scale)
#   timeout_s  per run (default 2 x est_s + 300)

[vars]
valkey_n = "850000"
valkey_secs = "5"
churn_class = "1024"
churn_secs = "8"
# Driver rows: the soak lengths (the acceptance protocol's; a smoke run
# passes --var valkey_soak_secs=60 and so on).
valkey_soak_secs = "1200"
valkey_soak_settle = "60"
ruby_soak_secs = "600"
jvm_soak_secs = "1200"
jvm_server_secs = "300"

# Practical thresholds delta (owner decision O9), in percent.
[class]
st = { delta_pct = 1.0 }
mt = { delta_pct = 2.0 }
server = { delta_pct = 3.0 }
soak = { delta_pct = 3.0, rss_delta_pct = 2.0, rss_delta_mib = 1.0 }
# Resident-memory figures of the soaks (peak, after settle): nearly
# deterministic, so a tighter margin.
soak-rss = { delta_pct = 2.0 }
# Resident-memory figures of the timed rows (maxrss_mib from rt, settle_mib
# from settle.so, the residue probe's readings).
rss = { delta_pct = 2.0 }

# ---- mimalloc-bench programs (bench/build.sh) ----------------------------

[row.larson1]
cmd = ["{bin}/larson", "5", "8", "1000", "5000", "100", "4141", "1"]
parser = "larson"
unit = "M ops/s"
better = "higher"
threads = 1
class = "st"
secs = 5
est_s = 7.5
metrics = [{ name = "maxrss_mib", unit = "MiB", better = "lower", class = "rss" }]

[row.larson10]
