# ---- the Valkey model (bench/probes/valkey_model.c) ----------------------
# valkey_n keys (about 500 MiB live), valkey_secs seconds: half write
# (SET over a full heap), half delete; scored by the write phase. Frees go
# through sdallocx where the allocator exports it.

[row.valkey1]
cmd = ["{tools}/valkey_model", "-n", "{valkey_n}", "-t", "{valkey_secs}", "-s"]
parser = "valkey_model.write"
unit = "M ops/s"
better = "higher"
threads = 1
class = "mt"
est_s = 5.5
metrics = [{ name = "maxrss_mib", unit = "MiB", better = "lower", class = "rss" }]

[row.valkey1-free]
cmd = ["{tools}/valkey_model", "-n", "{valkey_n}", "-t", "{valkey_secs}", "-s", "-f", "free"]
parser = "valkey_model.write"
unit = "M ops/s"
better = "higher"
threads = 1
class = "mt"
est_s = 5.5
metrics = [{ name = "maxrss_mib", unit = "MiB", better = "lower", class = "rss" }]

[row.valkey1-usable]
cmd = ["{tools}/valkey_model", "-n", "{valkey_n}", "-t", "{valkey_secs}", "-s", "-u"]
parser = "valkey_model.write"
unit = "M ops/s"
better = "higher"
threads = 1
class = "mt"
est_s = 9

# Write phase only, so a per-operation counter is per SET.
[row.valkey1-write]
cmd = ["{tools}/valkey_model", "-n", "{valkey_n}", "-w", "{valkey_secs}", "-d", "0", "-s"]
parser = "valkey_model.write"
unit = "M ops/s"
better = "higher"
threads = 1
class = "mt"
est_s = 9

# Valkey's unsized zmalloc shape (a usable-size query after every
# allocation and before every free) ...
[row.valkey1-write-zmalloc]
cmd = ["{tools}/valkey_model", "-n", "{valkey_n}", "-w", "{valkey_secs}", "-d", "0", "-s", "-u", "-a"]
parser = "valkey_model.write"
unit = "M ops/s"
better = "higher"
threads = 1
class = "mt"
est_s = 9

# ... and the challoc pair that replaces it (challoc builds only).
[row.valkey1-write-pair]
cmd = ["{tools}/valkey_model", "-n", "{valkey_n}", "-w", "{valkey_secs}", "-d", "0", "-s", "-p"]
parser = "valkey_model.write"
unit = "M ops/s"
better = "higher"
threads = 1
class = "mt"
requires = ["challoc"]
est_s = 9

# ---- the churn probe (bench/probes/churn.c) -------------------------------
# One size class at 44% occupancy under balanced random churn; the score
# is the class's end occupancy (compaction). Needs mallctl.
[row.churn1024]
cmd = ["{tools}/churn", "{churn_class}", "30000", "{churn_secs}", "0.56"]
parser = "churn.occ"
unit = "% occupancy"
better = "higher"
threads = 1
class = "st"
requires = ["mallctl"]
check = { min = 90.0 }
est_s = 10.5
settle = true
metrics = [{ name = "maxrss_mib", unit = "MiB", better = "lower", class = "rss" }, { name = "settle_mib", unit = "MiB", better = "lower", class = "rss" }]

# ---- Python (bench/probes/python/json_bench.py) ---------------------------

[row.python1]
cmd = ["python3", "{root}/bench/probes/python/json_bench.py"]
parser = "wall"
unit = "s"
better = "lower"
threads = 1
class = "st"
fixed_work = true
est_s = 5
needs = ["{root}/bench/probes/python/json_bench.py"]

[row.python1-malloc]
cmd = ["python3", "{root}/bench/probes/python/json_bench.py"]
env = { PYTHONMALLOC = "malloc" }
parser = "wall"
unit = "s"
better = "lower"
threads = 1
class = "st"
fixed_work = true
est_s = 5
needs = ["{root}/bench/probes/python/json_bench.py"]

# ---- drivers (bench/drivers/*.sh) -----------------------------------------
# The soaks run one variant per VM (cb launch): each (variant, replicate)
# gets a VM of its own for the whole soak, so a 20-minute soak of two
# variants takes 20 minutes, not 40.

# Valkey under valkey-benchmark and memtier: write phase, delete phase,
# settle (bench/drivers/valkey-soak.sh). challoc swaps in under the fixed
# runpath /opt/challoc/lib (one Valkey build, quantum8); jemalloc is the
# same tag with its bundled jemalloc 5.3.0.
[row.valkey-soak]
kind = "soak"
driver = "drivers/valkey-soak.sh"
metric = "write_mt_rps"
unit = "req/s"
better = "higher"
class = "soak"
features = "quantum8"
allocs = ["challoc", "jemalloc"]
placement = "one-variant-per-vm"
env = { DURATION = "{valkey_soak_secs}", SETTLE = "{valkey_soak_settle}", KEY_PATTERN = "stock" }
metrics = [
  { name = "delete_mt_rps", unit = "req/s", better = "higher", class = "soak" },
  { name = "write_mt_p99_ms", unit = "ms", better = "lower", class = "soak" },
  { name = "vmhwm_mib", unit = "MiB", better = "lower", class = "soak-rss" },
  { name = "rss_settle_mib", unit = "MiB", better = "lower", class = "soak-rss" },
]
est_s = 1500

# The Sidekiq-shaped Ruby process (bench/drivers/ruby-soak.sh): the
# --with-jemalloc Ruby, challoc preloaded under libjemalloc.so.2.
[row.ruby-soak]
kind = "soak"
driver = "drivers/ruby-soak.sh"
metric = "hwm_mib"
unit = "MiB"
better = "lower"
class = "soak-rss"
features = "jemalloc-soname"
allocs = ["challoc", "jemalloc"]
placement = "one-variant-per-vm"
env = { DURATION = "{ruby_soak_secs}" }
metrics = [
  { name = "rss_final_mib", unit = "MiB", better = "lower", class = "soak-rss" },
  { name = "rss_min_after_gc_mib", unit = "MiB", better = "lower", class = "soak-rss" },
  { name = "cpu_s", unit = "s", better = "lower", class = "soak" },
]
est_s = 1300

# The JVM mixed-size soak (bench/drivers/jvm-bench.sh ROWS=soak).
[row.jvm-soak]
kind = "soak"
driver = "drivers/jvm-bench.sh"
metric = "soak_tail_mib"
unit = "MiB"
better = "lower"
class = "soak-rss"
placement = "one-variant-per-vm"
env = { ROWS = "soak", SOAK_DURATION = "{jvm_soak_secs}" }
metrics = [
  { name = "soak_peak_mib", unit = "MiB", better = "lower", class = "soak-rss" },
  { name = "soak_json_rps_high", unit = "req/s", better = "higher", class = "soak" },
  { name = "soak_cpu_us_req_high", unit = "us/req", better = "lower", class = "soak" },
]
est_s = 1350

# The JVM http server row (ROWS=server): paired, minutes per run.
[row.jvm-server]
kind = "driver"
driver = "drivers/jvm-bench.sh"
metric = "json_rps"
unit = "req/s"
better = "higher"
class = "server"
env = { ROWS = "server", DURATION = "{jvm_server_secs}" }
metrics = [
  { name = "blob_rps", unit = "req/s", better = "higher", class = "server" },
  { name = "server_peak_mib", unit = "MiB", better = "lower", class = "soak-rss" },
]
est_s = 360

# ---- the kernel floor (bench/cb/floor-test.sh) ----------------------------
# The in-container part of `make test` on the variant's source tree: the
# release build, the jemalloc-compat stage, the unit and api:: tests, with
# CHALLOC_TEST_ALLOW_SKIP=1. Pass/fail (and the SKIP lines in the log), not
# a timing: run it in a smoke suite (bench/suites/exp-floor.toml).
[row.floor-test]
cmd = ["sh", "{root}/bench/cb/floor-test.sh"]
parser = "wall"
unit = "s"
better = "lower"
threads = 0
class = "st"
requires = ["challoc"]
est_s = 600

# ---- thread-cache residue (bench/probes/tcache_residue.c, issue #27) ------
# residue: T threads touch 24 classes once, then run 32 s (three cache GC
# intervals) on one class each and park; scored by the RSS after a forced
# purge with the threads alive. burst-idle: 16 threads, three 2 s bursts
# over 8 classes each followed by a 12 s idle; scored by the RSS at the
# end of the last idle.
[row.residue64]
cmd = ["{tools}/tcache_residue", "residue", "64", "32"]
parser = "kv"
metric = "rss_settle_kb"
unit = "KiB"
better = "lower"
threads = 64
class = "rss"
est_s = 36
metrics = [
  { name = "rss_first_mib", unit = "MiB", better = "lower", class = "rss" },
  { name = "rss_join_mib", unit = "MiB", better = "lower", class = "rss" },
  { name = "maxrss_mib", unit = "MiB", better = "lower", class = "rss" },
  { name = "hot_mops", unit = "M ops/s", better = "higher", class = "mt" },
]

[row.residue256]
cmd = ["{tools}/tcache_residue", "residue", "256", "32"]
parser = "kv"
metric = "rss_settle_kb"
unit = "KiB"
better = "lower"
threads = 256
class = "rss"
est_s = 38
metrics = [
  { name = "rss_first_mib", unit = "MiB", better = "lower", class = "rss" },
  { name = "rss_join_mib", unit = "MiB", better = "lower", class = "rss" },
  { name = "maxrss_mib", unit = "MiB", better = "lower", class = "rss" },
  { name = "hot_mops", unit = "M ops/s", better = "higher", class = "mt" },
]

[row.burst-idle]
cmd = ["{tools}/tcache_residue", "burst", "16", "3", "2000", "12000"]
parser = "kv"
metric = "rss_end_kb"
unit = "KiB"
better = "lower"
threads = 16
class = "rss"
est_s = 44
metrics = [
  { name = "rss_idle_mib", unit = "MiB", better = "lower", class = "rss" },
  { name = "maxrss_mib", unit = "MiB", better = "lower", class = "rss" },
  { name = "burst_mops", unit = "M ops/s", better = "higher", class = "server" },
]

# burst-idle with a 35 s idle (three and a half cache GC intervals) after
# each burst: what a longer idle releases.
[row.burst-idle-long]
cmd = ["{tools}/tcache_residue", "burst", "16", "3", "2000", "35000"]
parser = "kv"
metric = "rss_end_kb"
unit = "KiB"
better = "lower"
threads = 16
class = "rss"
est_s = 114
metrics = [
  { name = "rss_idle_mib", unit = "MiB", better = "lower", class = "rss" },
  { name = "maxrss_mib", unit = "MiB", better = "lower", class = "rss" },
  { name = "burst_mops", unit = "M ops/s", better = "higher", class = "server" },
]

# Build-tool shape: short-lived processes (cc1, as, ld) under the
# allocator, eight compiles of one probe.
[row.cc-hello]
cmd = ["sh", "-c", "for i in 1 2 3 4 5 6 7 8; do cc -O2 -c -o /dev/null {root}/bench/probes/valkey_model.c || exit 1; done"]
parser = "wall"
unit = "s"
better = "lower"
threads = 1
class = "st"
fixed_work = true
est_s = 6
needs = ["{root}/bench/probes/valkey_model.c"]

# ---- near a cgroup limit (bench/tools/ballast.c, issue #27) ---------------
# The row's program with the container's cgroup filled to 92% of its
# memory limit by a ballast child: challoc's cgroup policy is in its
# immediate band (design 11: purge at once, the cache GC on every periodic
# tick). Only under a container with a memory limit (suite exp-27-cg,
# 3 GiB); without one ballast exits 2 and the row fails. The ballast is a
# child of the measured process tree, so maxrss and the counters are not
# the program's: the rows are scored by the program's own rate only.
[row.xmalloc-cg]
cmd = ["{tools}/ballast", "92", "{bin}/xmalloc-test", "-w", "10", "-t", "5", "-s", "64"]
parser = "xmalloc"
unit = "M frees/s"
better = "higher"
threads = 10
class = "mt"
secs = 5
est_s = 7

[row.xmallocN-cg]
cmd = ["{tools}/ballast", "92", "{bin}/xmalloc-test", "-w", "{nproc}", "-t", "5", "-s", "64"]
parser = "xmalloc"
unit = "M frees/s"
better = "higher"
threads = 0
class = "mt"
secs = 5
est_s = 7.5

[row.larson10-cg]
cmd = ["{tools}/ballast", "92", "{bin}/larson", "5", "8", "1000", "5000", "100", "4141", "10"]
parser = "larson"
unit = "M ops/s"
better = "higher"
threads = 10
class = "mt"
secs = 5
est_s = 9

[row.residue64-cg]
cmd = ["{tools}/ballast", "92", "{tools}/tcache_residue", "residue", "64", "32"]
parser = "kv"
metric = "hot_mops"
unit = "M ops/s"
better = "higher"
threads = 64
class = "mt"
est_s = 38
metrics = [{ name = "rss_settle_mib", unit = "MiB", better = "lower", class = "rss" }]
