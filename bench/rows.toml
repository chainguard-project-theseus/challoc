# ---- the Valkey model (bench/probes/valkey_model.c) ----------------------
# valkey_n keys (about 500 MiB live), valkey_secs seconds: half write
# (SET over a full heap), half delete; scored by the write phase. Frees go
# through sdallocx where the allocator exports it.

[row.valkey1]
cmd = ["{tools}/valkey_model", "-n", "{valkey_n}", "-t", "{valkey_secs}", "-s"]
parser = "valkey_model.write"
unit = "M ops/s"
better = "higher"
threads = 1
class = "mt"
est_s = 5.5

[row.valkey1-free]
cmd = ["{tools}/valkey_model", "-n", "{valkey_n}", "-t", "{valkey_secs}", "-s", "-f", "free"]
parser = "valkey_model.write"
unit = "M ops/s"
better = "higher"
threads = 1
class = "mt"
est_s = 5.5

[row.valkey1-usable]
cmd = ["{tools}/valkey_model", "-n", "{valkey_n}", "-t", "{valkey_secs}", "-s", "-u"]
parser = "valkey_model.write"
unit = "M ops/s"
better = "higher"
threads = 1
class = "mt"
est_s = 9

# Write phase only, so a per-operation counter is per SET.
[row.valkey1-write]
cmd = ["{tools}/valkey_model", "-n", "{valkey_n}", "-w", "{valkey_secs}", "-d", "0", "-s"]
parser = "valkey_model.write"
unit = "M ops/s"
better = "higher"
threads = 1
class = "mt"
est_s = 9

# Valkey's unsized zmalloc shape (a usable-size query after every
# allocation and before every free) ...
[row.valkey1-write-zmalloc]
cmd = ["{tools}/valkey_model", "-n", "{valkey_n}", "-w", "{valkey_secs}", "-d", "0", "-s", "-u", "-a"]
parser = "valkey_model.write"
unit = "M ops/s"
better = "higher"
threads = 1
class = "mt"
est_s = 9

# ... and the challoc pair that replaces it (challoc builds only).
[row.valkey1-write-pair]
cmd = ["{tools}/valkey_model", "-n", "{valkey_n}", "-w", "{valkey_secs}", "-d", "0", "-s", "-p"]
parser = "valkey_model.write"
unit = "M ops/s"
better = "higher"
threads = 1
class = "mt"
requires = ["challoc"]
est_s = 9

# ---- the churn probe (bench/probes/churn.c) -------------------------------
# One size class at 44% occupancy under balanced random churn; the score
# is the class's end occupancy (compaction). Needs mallctl.
[row.churn1024]
cmd = ["{tools}/churn", "{churn_class}", "30000", "{churn_secs}", "0.56"]
parser = "churn.occ"
unit = "% occupancy"
better = "higher"
threads = 1
class = "st"
requires = ["mallctl"]
check = { min = 90.0 }
est_s = 10.5

# ---- Python (bench/probes/python/json_bench.py) ---------------------------

[row.python1]
cmd = ["python3", "{root}/bench/probes/python/json_bench.py"]
parser = "wall"
unit = "s"
better = "lower"
threads = 1
class = "st"
fixed_work = true
est_s = 5
needs = ["{root}/bench/probes/python/json_bench.py"]

[row.python1-malloc]
cmd = ["python3", "{root}/bench/probes/python/json_bench.py"]
env = { PYTHONMALLOC = "malloc" }
parser = "wall"
unit = "s"
better = "lower"
threads = 1
class = "st"
fixed_work = true
est_s = 5
needs = ["{root}/bench/probes/python/json_bench.py"]

# ---- drivers (bench/drivers/*.sh) -----------------------------------------
# The soaks run one variant per VM (cb launch): each (variant, replicate)
# gets a VM of its own for the whole soak, so a 20-minute soak of two
# variants takes 20 minutes, not 40.

# Valkey under valkey-benchmark and memtier: write phase, delete phase,
# settle (bench/drivers/valkey-soak.sh). challoc swaps in under the fixed
# runpath /opt/challoc/lib (one Valkey build, quantum8); jemalloc is the
# same tag with its bundled jemalloc 5.3.0.
[row.valkey-soak]
kind = "soak"
driver = "drivers/valkey-soak.sh"
metric = "write_mt_rps"
unit = "req/s"
better = "higher"
class = "soak"
features = "quantum8"
allocs = ["challoc", "jemalloc"]
placement = "one-variant-per-vm"
env = { DURATION = "{valkey_soak_secs}", SETTLE = "{valkey_soak_settle}", KEY_PATTERN = "stock" }
metrics = [
  { name = "delete_mt_rps", unit = "req/s", better = "higher", class = "soak" },
  { name = "write_mt_p99_ms", unit = "ms", better = "lower", class = "soak" },
  { name = "vmhwm_mib", unit = "MiB", better = "lower", class = "soak-rss" },
  { name = "rss_settle_mib", unit = "MiB", better = "lower", class = "soak-rss" },
]
est_s = 1500

# The Sidekiq-shaped Ruby process (bench/drivers/ruby-soak.sh): the
# --with-jemalloc Ruby, challoc preloaded under libjemalloc.so.2.
[row.ruby-soak]
kind = "soak"
driver = "drivers/ruby-soak.sh"
metric = "hwm_mib"
unit = "MiB"
better = "lower"
class = "soak-rss"
features = "jemalloc-soname"
allocs = ["challoc", "jemalloc"]
placement = "one-variant-per-vm"
env = { DURATION = "{ruby_soak_secs}" }
metrics = [
  { name = "rss_final_mib", unit = "MiB", better = "lower", class = "soak-rss" },
  { name = "rss_min_after_gc_mib", unit = "MiB", better = "lower", class = "soak-rss" },
  { name = "cpu_s", unit = "s", better = "lower", class = "soak" },
]
est_s = 1300

# The JVM mixed-size soak (bench/drivers/jvm-bench.sh ROWS=soak).
[row.jvm-soak]
kind = "soak"
driver = "drivers/jvm-bench.sh"
metric = "soak_tail_mib"
unit = "MiB"
better = "lower"
class = "soak-rss"
placement = "one-variant-per-vm"
env = { ROWS = "soak", SOAK_DURATION = "{jvm_soak_secs}" }
metrics = [
  { name = "soak_peak_mib", unit = "MiB", better = "lower", class = "soak-rss" },
  { name = "soak_json_rps_high", unit = "req/s", better = "higher", class = "soak" },
  { name = "soak_cpu_us_req_high", unit = "us/req", better = "lower", class = "soak" },
]
est_s = 1350

# The JVM http server row (ROWS=server): paired, minutes per run.
[row.jvm-server]
kind = "driver"
driver = "drivers/jvm-bench.sh"
metric = "json_rps"
unit = "req/s"
better = "higher"
class = "server"
env = { ROWS = "server", DURATION = "{jvm_server_secs}" }
metrics = [
  { name = "blob_rps", unit = "req/s", better = "higher", class = "server" },
  { name = "server_peak_mib", unit = "MiB", better = "lower", class = "soak-rss" },
]
est_s = 360

# ---- the kernel floor (bench/cb/floor-test.sh) ----------------------------
# `make test` and `make fuzz` on the variant's source tree: the release
# build, the jemalloc-compat stage, the unit and api:: tests with
# CHALLOC_TEST_ALLOW_SKIP=1, the cgroup steps where the container may write
# its cgroup (privileged), and the 10M-operation fuzz. Pass/fail (and the
# SKIP and OUTCOME lines in the log), not a timing: run it in a smoke suite
# (bench/suites/exp-floor.toml).
[row.floor-test]
cmd = ["sh", "{root}/bench/cb/floor-test.sh"]
parser = "wall"
unit = "s"
better = "lower"
threads = 0
class = "st"
requires = ["challoc"]
est_s = 780

# ---- thread churn (#94; bench/suites/exp-churn.toml) ----------------------
# larson with 10 and 1000 rounds per worker thread instead of 100: a thread
# lives for rounds x 5000 malloc/free pairs, then exits and a new one takes
# its slot, so instructions per op at the two settings give the steady-state
# cost and the cost of one thread switch (exit flush + refill):
# switch = (I10 - I1000) / (1/50000 - 1/5000000) instructions.
[row.larson1-r10]
cmd = ["{bin}/larson", "5", "8", "1000", "5000", "10", "4141", "1"]
parser = "larson"
unit = "M ops/s"
better = "higher"
threads = 1
class = "st"
secs = 5
est_s = 7.5

[row.larson1-r1000]
cmd = ["{bin}/larson", "5", "8", "1000", "5000", "1000", "4141", "1"]
parser = "larson"
unit = "M ops/s"
better = "higher"
threads = 1
class = "st"
secs = 5
est_s = 7.5

[row.larsonN-r10]
cmd = ["{bin}/larson", "5", "8", "1000", "5000", "10", "4141", "{nproc}"]
parser = "larson"
unit = "M ops/s"
better = "higher"
threads = 0
class = "mt"
secs = 5
est_s = 7

[row.larsonN-r1000]
cmd = ["{bin}/larson", "5", "8", "1000", "5000", "1000", "4141", "{nproc}"]
parser = "larson"
unit = "M ops/s"
better = "higher"
threads = 0
class = "mt"
secs = 5
est_s = 7

# The perf event sources and, where the CPU has the Statistical Profiling
# Extension (arm_spe_0), an SPE recording of a short larson1 under the
# variant: samples per synthesized event (tlb-miss, l1d-miss, ...), the
# symbols and the distinct data pages of the tlb-miss samples
# (bench/probes/spe-probe.sh; needs the perf bundle and, for SPE, the
# modprobe:arm_spe_pmu prep and a privileged container). Output in the
# row's log; scored by wall time, no verdict.
[row.spe-probe]
cmd = ["sh", "{root}/bench/probes/spe-probe.sh", "{bin}/larson", "2", "8", "1000", "5000", "100", "4141", "1"]
parser = "wall"
unit = "s"
better = "lower"
threads = 1
class = "st"
est_s = 20

# ---- the rest of mimalloc-bench (bench/build.sh; bench.sh's arguments) ---

# larson's sized-delete build (-fsized-deallocation): the sized free path.
[row.larsonN-sized]
