# cow: Valkey's and Redis's fork copy-on-write under a BGSAVE
# (bench/drivers/valkey-cow.sh, docs/design.md section 5, "Fork epochs"),
# base vs head challoc with the bundled jemalloc as the control: the copy at
# 64 B and 1 KiB values, SET throughput outside and inside the save, and the
# RSS after the save with activedefrag on. One variant per VM. Pair it with
# kv-valkey or kv-redis (the command-mix rows) for the throughput of
# everything else. Both servers' contrib series open the epoch whenever the
# library has it, so for the epoch's own effect run one build twice:
# --variants 'noepoch=head@cow_epoch:false,head'.
description = "Valkey and Redis BGSAVE copy-on-write: challoc base vs head (fork epochs), bundled jemalloc as control"
cells = "tag:gate"
variants = ["base", "head"]
controls = ["jemalloc"]
rows = ["valkey-cow", "valkey-cow-d1k", "valkey-cow-tput", "valkey-cow-rec",
        "redis-cow", "redis-cow-d1k", "redis-cow-tput", "redis-cow-rec"]
replicas = 3
blocks = 1
warmup_blocks = 0
shard_seconds = 1500
looks = 1
budget_usd = 40

[local]
blocks = 1
