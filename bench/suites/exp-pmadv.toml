# exp-pmadv: batched purges through process_madvise (the default where the
# probe finds it) against the plain madvise loop (issue #18). The loop
# variant is the throwaway branch exp/force-madvise (one line in
# purge::configure). Privileged: the default seccomp profile hides
# process_madvise, so only the privileged container shows a difference.
# Rows where purges are: the valkey_model delete phase (default decay and
# dirty_decay_ms:0), larson10, and the Valkey soak's delete phase
# (exp-pmadv-soak). Cut if the difference is under 1%.
description = "#18: process_madvise (default) vs forced madvise loop"
cells = "cgos72-amd64,ref-amd64"
variants = ["pmadv=head", "loop=git:exp/force-madvise"]
controls = []
rows = ["valkey1-delete", "valkey1-delete-d0", "larson10"]
container = { profile = "privileged" }
replicas = 4
blocks = 5
warmup_blocks = 1
shard_seconds = 600
looks = 1
budget_usd = 6

[local]
blocks = 3
