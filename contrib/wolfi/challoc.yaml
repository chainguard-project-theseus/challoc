# challoc: Wolfi/melange package definition (docs/plan.md Phase 3 task 1,
# docs/design.md section 13.6). Draft tracked here under contrib/; the copy
# that ships lives in the wolfi-dev/os repository.
#
# Three packages from one source tree and two cargo builds:
#
#   challoc                  /usr/lib/libchalloc.so.0        quantum16 (the
#                            system library, the class table Wolfi's jemalloc
#                            consumers already run on; design 13.6)
#   challoc-dev              /usr/lib/libchalloc.so -> libchalloc.so.0,
#                            /usr/include/challoc/jemalloc.h,
#                            /usr/lib/pkgconfig/challoc.pc
#   challoc-jemalloc-compat  /usr/lib/libjemalloc.so.2       quantum16, built
#                            with the `jemalloc-soname` feature and staged by
#                            scripts/jemalloc-compat.sh (design 13.2),
#                            /usr/lib/libjemalloc.so -> libjemalloc.so.2,
#                            /usr/lib/pkgconfig/jemalloc.pc (Version 5.3.0)
#
# Valkey's private quantum8 build is task 2 and lives in valkey.yaml, not
# here (two libraries with one soname cannot share /usr/lib).
#
# Local build (contrib/wolfi/README.md has the full recipe): from the
# repository root, with the tree as the source instead of git-checkout,
#
#   melange build contrib/wolfi/challoc.yaml --arch aarch64 \
#     --source-dir . --build-option local-source \
#     --pipeline-dir /path/to/wolfi-dev/os/pipelines \
#     --signing-key melange.rsa --out-dir packages
package:
  name: challoc
  version: "0.1.0"
  epoch: 0
  description: A memory-safe, jemalloc-compatible malloc replacement for Wolfi and Chainguard OS
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  rust-version: "1.98"
  # The ABI major in the soname (build.rs: libchalloc.so.0). Bump with it.
  soversion: "0"
  # The version mallctl("version") reports and jemalloc.pc carries
  # (src/api/mallctl.rs VERSION_STR minus its -0-gchalloc tail). The
  # pipeline checks the built library agrees.
  jemalloc-version: "5.3.0"

options:
  # `--build-option local-source`: skip git-checkout and build the tree
  # melange was given with --source-dir (a local or CI build of this
  # repository). Without it the pipeline fetches the tagged release.
  local-source: {}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - rust-${{vars.rust-version}}
      - wolfi-base

pipeline:
  - uses: git-checkout
    if: ${{options.local-source.enabled}} == 'false'
    with:
      repository: https://github.com/chainguard-dev/challoc
      tag: v${{package.version}}
      # The repository has no release tag yet (2026-09-20): this is the
      # main commit the definition was written against. The Wolfi PR that
      # carries this file sets the tag and its commit.
      expected-commit: 4a7d30caedf898f23f100210d0e2770d59901fee

  - name: Check the tree matches the package version
    runs: |
      crate=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
      [ "$crate" = "${{package.version}}" ] || {
        echo "Cargo.toml version $crate != package.version ${{package.version}}"; exit 1; }
      jv=$(sed -n 's/^pub const VERSION_STR: &str = "\([0-9][0-9.]*\)-.*/\1/p' src/api/mallctl.rs)
      [ "$jv" = "${{vars.jemalloc-version}}" ] || {
        echo "VERSION_STR $jv != vars.jemalloc-version ${{vars.jemalloc-version}}"; exit 1; }
      rustc --version; cargo --version

  - name: Build the system library (quantum16, soname libchalloc.so.0)
    runs: |
      cargo build --release --locked --no-default-features --features quantum16
      readelf -d target/release/libchalloc.so | grep -q 'Library soname: \[libchalloc.so.${{vars.soversion}}\]'

  - name: Install the runtime, the link name, the header and challoc.pc
    runs: |
      lib=${{targets.destdir}}/usr/lib
      install -Dm755 target/release/libchalloc.so "$lib/libchalloc.so.${{vars.soversion}}"
      ln -s libchalloc.so.${{vars.soversion}} "$lib/libchalloc.so"
      install -Dm644 contrib/valkey/include/challoc/jemalloc.h \
        ${{targets.destdir}}/usr/include/challoc/jemalloc.h
      mkdir -p "$lib/pkgconfig"
      # Libs scopes --no-as-needed to -lchalloc so a consumer that
      # references no allocator symbol itself still records DT_NEEDED
      # libchalloc.so.0 (design 13.6: Wolfi's gcc links --as-needed by
      # default and would drop it, and the program would silently run on
      # glibc malloc).
      cat > "$lib/pkgconfig/challoc.pc" <<PC
      prefix=/usr
      exec_prefix=\${prefix}
      libdir=\${exec_prefix}/lib
      includedir=\${prefix}/include

      Name: challoc
      Description: A memory-safe, jemalloc-compatible malloc replacement
      URL: https://github.com/chainguard-dev/challoc
      Version: ${{package.version}}
      Cflags: -I\${includedir}
      Libs: -L\${libdir} -Wl,--push-state,--no-as-needed -lchalloc -Wl,--pop-state
      PC

  - uses: strip

subpackages:
  - name: challoc-dev
    description: challoc headers, link name and pkg-config file
    dependencies:
      runtime:
        - challoc=${{package.full-version}}
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - binutils
            - build-base
            - pkgconf
      pipeline:
        - uses: test/tw/ldd-check
          with:
            packages: challoc
        - uses: test/pkgconf
        - name: Link a program with pkg-config's flags and check DT_NEEDED
          runs: |
            set -eux
            [ "$(pkg-config --modversion challoc)" = "${{package.version}}" ]
            [ "$(readlink /usr/lib/libchalloc.so)" = "libchalloc.so.${{vars.soversion}}" ]
            cat > version.c <<'EOF'
            #include <stdio.h>
            #include <stdlib.h>
            #include <string.h>
            #include <challoc/jemalloc.h>
            extern const char *challoc_version(void);
            int main(void) {
                const char *v = challoc_version();
                char *p = je_malloc(100);
                size_t n = je_malloc_usable_size(p);
                const char *jv = NULL; size_t sz = sizeof jv;
                if (je_mallctl("version", &jv, &sz, NULL, 0) != 0) return 2;
                printf("challoc_version=%s usable=%zu mallctl.version=%s\n", v, n, jv);
                je_free(p);
                return strcmp(v, "${{package.version}}") == 0 && n >= 100 ? 0 : 1;
            }
            EOF
            gcc $(pkg-config --cflags challoc) version.c -o version $(pkg-config --libs challoc)
            readelf -d version | grep NEEDED
            readelf -d version | grep -q 'NEEDED.*\[libchalloc.so.${{vars.soversion}}\]'
            ./version
            # A program that references nothing from the library: the pc
            # file's --no-as-needed must still keep DT_NEEDED (design 13.6).
            printf 'int main(void){return 0;}\n' > none.c
            gcc none.c -o none $(pkg-config --libs challoc)
            readelf -d none | grep -q 'NEEDED.*\[libchalloc.so.${{vars.soversion}}\]'
            ./none

  - name: challoc-jemalloc-compat
    description: challoc under jemalloc's soname (libjemalloc.so.2) and jemalloc.pc, for link-only jemalloc consumers
    dependencies:
      # A drop-in for Wolfi's libjemalloc2 runtime and, for the link name
      # and the pc file, jemalloc-dev: same file paths, so the packages
      # conflict and a consumer picks one by name. No header is shipped:
      # a program that includes <jemalloc/jemalloc.h> takes it from
      # jemalloc-dev (Phase 1 task 6 decision), so the two -dev packages
      # cannot be co-installed; contrib/wolfi/README.md discusses it.
      provides:
        - libjemalloc2=${{package.full-version}}
    pipeline:
      - name: Build with the jemalloc-soname feature and stage as scripts/jemalloc-compat.sh does
        runs: |
          QUANTUM=16 PREFIX=/usr OUT="$PWD/compat-stage" TARGET_DIR="$PWD/target/jemalloc-compat" \
            sh scripts/jemalloc-compat.sh
          mkdir -p ${{targets.contextdir}}/usr/lib/pkgconfig
          cp -a compat-stage/lib/libjemalloc.so.2 compat-stage/lib/libjemalloc.so ${{targets.contextdir}}/usr/lib/
          cp compat-stage/lib/pkgconfig/jemalloc.pc ${{targets.contextdir}}/usr/lib/pkgconfig/
          grep -q '^Version: ${{vars.jemalloc-version}}$' ${{targets.contextdir}}/usr/lib/pkgconfig/jemalloc.pc
          grep -q '^prefix=/usr$' ${{targets.contextdir}}/usr/lib/pkgconfig/jemalloc.pc
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - binutils
            - build-base
            - pkgconf
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/pkgconf
        - name: The library carries jemalloc's soname and is challoc
          runs: |
            set -eux
            readelf -d /usr/lib/libjemalloc.so.2 | grep -q 'Library soname: \[libjemalloc.so.2\]'
            [ "$(readlink /usr/lib/libjemalloc.so)" = libjemalloc.so.2 ]
            [ "$(pkg-config --modversion jemalloc)" = "${{vars.jemalloc-version}}" ]
            pkg-config --atleast-version=5.3 jemalloc
            pkg-config --libs jemalloc | grep -q -- '-ljemalloc'
            LD_PRELOAD=/usr/lib/libjemalloc.so.2 ls / >/dev/null
        - name: A link-only jemalloc consumer resolves mallocx into the compat library
          runs: |
            set -eux
            cat > compat.c <<'EOF'
            #define _GNU_SOURCE
            #include <dlfcn.h>
            #include <stdio.h>
            #include <stdlib.h>
            #include <string.h>
            extern void *mallocx(size_t, int);
            extern void dallocx(void *, int);
            extern size_t sallocx(const void *, int);
            extern int mallctl(const char *, void *, size_t *, void *, size_t);
            int main(void) {
                void *p = mallocx(64, 0);
                if (!p || sallocx(p, 0) < 64) return 1;
                Dl_info di;
                if (!dladdr((void *)mallocx, &di) || !dladdr((void *)malloc, &di)) return 2;
                Dl_info dm; dladdr((void *)malloc, &dm);
                const char *v = NULL; size_t sz = sizeof v;
                if (mallctl("version", &v, &sz, NULL, 0) != 0) return 3;
                printf("mallocx from %s\nmalloc from %s\nversion %s\n", di.dli_fname, dm.dli_fname, v);
                dallocx(p, 0);
                const char *tail = strrchr(di.dli_fname, '/');
                if (!tail || strcmp(tail, "/libjemalloc.so.2") != 0) return 4;
                tail = strrchr(dm.dli_fname, '/');
                if (!tail || strcmp(tail, "/libjemalloc.so.2") != 0) return 5;
                return strstr(v, "challoc") ? 0 : 6;
            }
            EOF
            gcc compat.c -o compat $(pkg-config --libs jemalloc) -ldl
            readelf -d compat | grep NEEDED
            # scripts/check-needed.sh's rule: DT_NEEDED must name the library.
            readelf -d compat | grep -q 'NEEDED.*\[libjemalloc.so.2\]'
            ./compat

update:
  enabled: false
  exclude-reason: no release tags yet; the version is pinned by hand from Cargo.toml until the first tag

test:
  environment:
    contents:
      packages:
        - binutils
        - posix-libc-utils
  pipeline:
    - uses: test/tw/ldd-check
    - name: soname, loadability and an LD_PRELOAD run
      runs: |
        set -eux
        readelf -d /usr/lib/libchalloc.so.${{vars.soversion}} | grep 'Library soname'
        readelf -d /usr/lib/libchalloc.so.${{vars.soversion}} | grep -q 'Library soname: \[libchalloc.so.${{vars.soversion}}\]'
        ldd /usr/lib/libchalloc.so.${{vars.soversion}}
        ! ldd /usr/lib/libchalloc.so.${{vars.soversion}} | grep -q 'not found'
        # The runtime package ships no link name: that is challoc-dev's.
        ! [ -e /usr/lib/libchalloc.so ]
        LD_PRELOAD=/usr/lib/libchalloc.so.${{vars.soversion}} ls /usr/lib | grep -q libchalloc.so.${{vars.soversion}}
        LD_PRELOAD=/usr/lib/libchalloc.so.${{vars.soversion}} readelf -h /usr/lib/libchalloc.so.${{vars.soversion}} | grep -q 'Shared object file'
