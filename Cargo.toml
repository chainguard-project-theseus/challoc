[package]
name = "challoc"
version = "0.1.0"
edition = "2024"
description = "A memory-safe, jemalloc-compatible malloc replacement for Wolfi and Chainguard OS"
license = "Apache-2.0"
publish = false
# The verified floor, not the true minimum: rustc 1.94.1 builds the crate
# and runs its unit tests, and nothing older has been tried. Dockerfile.dev
# and the Wolfi package (contrib/wolfi/challoc.yaml) pin 1.98; that is what
# ships.
rust-version = "1.94"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["quantum16"]
# Size-class quantum. Exactly one must be enabled (design.md section 3).
quantum16 = []
quantum8 = []
# Gives the cdylib jemalloc's soname, `libjemalloc.so.2`, for link-only
# jemalloc consumers (design.md section 13.2). Exports are unchanged;
# `make jemalloc-compat` stages the result under that name with a
# `jemalloc.pc`. See build.rs.
jemalloc-soname = []

[dependencies]
# Type definitions only (c_int, size_t, ...). No std, no allocation.
libc = { version = "0.2", default-features = false }
# Verus specifications and proofs (`verus/README.md`). Ghost code is erased
# from ordinary builds; without default features vstd needs neither std nor
# alloc. The Verus release must match this version exactly.
vstd = { version = "=0.0.0-2026-10-18-0147", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
# `overflow-checks = true` was priced on both reference VMs: xmalloc
# +15..18%, larson1 +6..8%, larson10 +4..5% behind the same code without
# it, so the shipped library keeps the default (off). The counters
# that could wrap are guarded by explicit release assertions instead
# (`ClassState`, `HugeStats`, `Table`), and the unit tests run with the
# checks on (the dev profile).

[package.metadata.verus]
verify = true

[lints.rust]
# Verus sets `verus_keep_ghost` while verifying (`verus/README.md`), and
# Kani sets `kani` for its harnesses (`src/kani/` and the `kani_*`
# modules of other files). The loom crate (`tests/loom`) sets `loom` when
# it compiles the `vspec` atomic wrappers (`src/sync.rs`).
# `verus/notcopy-control.sh` sets `challoc_notcopy_control` to build the
# controls of `src/vspec/notcopy.rs`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)", "cfg(kani)", "cfg(loom)", "cfg(challoc_tls_check)", "cfg(challoc_notcopy_control)"] }

[lints.clippy]
# CONTRIBUTING.md, "Code style": every `unsafe` block names the invariant it
# relies on in a `// SAFETY:` comment. CI's clippy runs with `-D warnings`.
undocumented_unsafe_blocks = "warn"
# The template's: no `dbg!` (it writes to stderr through std) and no
# `todo!` stub reaches main.
dbg_macro = "deny"
todo = "deny"
