# The source of truth for .github/CODEOWNERS, which renders it without the
# bot: owners. GitHub reads the rendering with last match wins.
#
# The Checks review gate reads this file from the default branch.
# bot:challoc is the reviewer declared in .chainguard/reviewers.yaml: on a
# gated entry its approve verdict satisfies a path the way an owner's
# approval does. The entry below is gated, so Checks submits an approving
# review as chainguard[bot] on a gated entry when reviewers.yaml sets
# `approve: true`, which it does. A path the reviewers read as their own
# definitions (this file, reviewers.yaml, the prompt file, AGENTS.md,
# CLAUDE.md) always needs a person's approval, from someone named here
# other than the author or a pusher of the head.
version: 1
entries:
  - pattern: '*'
    owners: [dlorenc, mattmoor, tcnghia, 'bot:challoc', wolfi-dev/foundations-squad]
    gate: 1
    note: 'every path, gated: the maintainers, the wolfi-dev/foundations-squad team and the challoc Checks reviewer (bot:challoc, .chainguard/reviewers.yaml), whose approve verdict at a head satisfies the gate as an owner approval does'
