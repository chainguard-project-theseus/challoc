# codeowners-gate sidecar for chainguard-project-theseus/challoc: the
# source of truth for .github/CODEOWNERS, which renders it without the bot:
# owners. Change both with a change request and mono's
# hack/codeowners-gate/run.sh apply (mono's codeowners skill), run from the
# root of this repository. GitHub reads the rendering with last match wins.
#
# The Checks review gate (mono's ai-cicd/sandbox/internal/codereview) reads
# this file from the default branch. bot:challoc is the reviewer declared in
# .chainguard/reviewers.yaml: on a gated entry its approve verdict satisfies
# a path the way an owner's approval does. Every entry below is gated, so
# Checks submits an approving review as chainguard[bot] once every changed
# path is satisfied, when reviewers.yaml sets `approve: true`, which it
# does. A path the reviewers read as their own definitions (this file,
# reviewers.yaml, the prompt file, AGENTS.md, CLAUDE.md) always needs a
# person's approval, from someone named here other than the author or a
# pusher of the head.
#
# The entries after the first leave the reviewer out, so Checks never
# approves a pull request that changes the files they name: SECURITY.md,
# .chainguard/ci/, ci/, Cargo.toml and include/. An author and a reviewer
# that are both agents cannot change those files between them. A person's
# approving review is what merges such a pull request. GitHub requests the
# owners named here, but branch protection (chainguard-dev/infra
# github-iac, `require_code_owner_reviews: false`) accepts one approving
# review from anyone with write access, so nothing requires that person
# to be one of these owners.
#
# They are the template's set as it applies here, not every input a gate
# reads. Every other path stays with the `*` entry, so the reviewer alone
# can approve it, held to review-prompt.md and AGENTS.md. That includes,
# for example, the Makefile (with the kit's PROVED_PORT_VERSION), scripts/,
# verus/ (FLOOR and the counter's count.toml), .claude/settings.json,
# tests/ and source-level lint allows.
version: 1
entries:
  - pattern: '*'
    owners: [dlorenc, mattmoor, tcnghia, 'bot:challoc', chainguard-project-theseus/theseus-team]
    gate: 1
    note: 'every path, gated: the maintainers, the theseus-team and the challoc Checks reviewer (bot:challoc, .chainguard/reviewers.yaml), whose approve verdict at a head satisfies the gate as an owner approval does (mono code-reviewer README, "4. Let its approvals count")'
  - pattern: /SECURITY.md
    owners: [dlorenc, mattmoor, tcnghia, chainguard-project-theseus/theseus-team]
    gate: 1
    note: 'the threat model: never the Checks reviewer alone, so a person approves'
  - pattern: /.chainguard/ci/
    owners: [dlorenc, mattmoor, tcnghia, chainguard-project-theseus/theseus-team]
    gate: 1
    note: 'the check definitions (which checks run, and which block): never the Checks reviewer alone, so a person approves'
  - pattern: /ci/
    owners: [dlorenc, mattmoor, tcnghia, chainguard-project-theseus/theseus-team]
    gate: 1
    note: 'the gate scripts (expected skips, known failures, the kernel floor): never the Checks reviewer alone, so a person approves'
  - pattern: /Cargo.toml
    owners: [dlorenc, mattmoor, tcnghia, chainguard-project-theseus/theseus-team]
    gate: 1
    note: 'the crate''s lint levels, features and release profile: never the Checks reviewer alone, so a person approves'
  - pattern: /include/
    owners: [dlorenc, mattmoor, tcnghia, chainguard-project-theseus/theseus-team]
    gate: 1
    note: 'the public C headers (challoc and jemalloc-compat), which declare what the library exports: never the Checks reviewer alone, so a person approves'
