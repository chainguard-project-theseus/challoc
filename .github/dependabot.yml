# Dependabot keeps the one crate dependency and the wolfi-base digest pin
# of Dockerfile.dev current. Weekly, so a bump is one PR per ecosystem. CI
# is Chainguard Checks (.chainguard/ci/), which pins its tools as Wolfi
# packages; there are no GitHub Actions to bump.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The wolfi-base digest pin of Dockerfile.dev.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
