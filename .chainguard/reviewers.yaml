# Checks code reviewers for challoc. Read from the default branch by the
# Checks code reviewer, so a change here takes effect once it merges. The
# reviewer named here is the `bot:challoc` owner of every path in
# .github/codeowners.yaml, on a gated entry: with `approve: true` below,
# Checks submits an approving review as chainguard[bot] when its verdict at
# a head is approve. Paths the reviewers read as their own definitions still
# need a person.
version: 1
approve: true
# Per-pass limits, at their ceilings: a challoc proof pull request reaches
# 2,000 to 3,000 changed lines, often in one source file plus its generated
# ledger file under verus/ledger/, so each pass may read the diff and its
# context up to these ceilings.
limits:
  read_calls: 60
  read_kib: 800
reviewers:
  - name: challoc
    trigger:
      paths: ["**"]
    prompt_file: review-prompt.md
    # Run again at the same head once the presubmit aggregate finishes, so
    # a verdict that waited on CI (codegen, verus) reads the results.
    rerun_on_checks: ["Chainguard Checks (presubmit)"]
