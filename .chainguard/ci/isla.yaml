# The inline-assembly checks. Isla over the seams verus/isla/seams.md
# lists (make isla, verus/ISLA.md), and make emptyasm over the
# empty-template register hints (emptyasm below), each architecture
# natively on its own runner, at quantum 16 and at quantum 8, since the
# quantum changes what the compiler inlines around each site.
#
# make isla: section 1 checks the asm templates against templates.txt and
# that seams.md matches the ledger (verus/ledger/, seams.sh --check);
# ISLA_TARGETS then picks the half, which builds the release static
# library for the host (so no cross standard library). The aarch64 half,
# on arm64, traces on the Sail Armv8.5-A model `svc #0`, every TLS slot
# load and store (tls::get_tp, get and set), every `mrs` of TPIDR_EL0
# (rseq::thread_pointer), `brk #0x1` (sys::trap), the GOT functions
# (api::cxx, config) and rseq::symbols, and every PAC instruction
# (sys::pac's pacda, autda and xpacd) on it and on the Armv9.4-A model.
# The x86_64 half, on amd64, traces `syscall`, every TLS slot load and
# store, every load of %fs:0, `ud2`, the GOT functions and rseq::symbols
# on the Sail x86 model. Each half checks its jobs with isla-check and
# must see each negative control rejected.
#
# The presubmit `isla` runs the aarch64 half only. No package carries the
# x86 model (isla-snapshots has only the Arm models), so without
# ISLA_X86_IR the x86_64 half fetches rems-project/sail-x86-from-acl2 at
# a pinned commit from github.com and builds the model with sail and
# isla-sail (verus/isla/x86/build-ir.sh). So that the presubmit
# depends on neither github.com nor a model build at run time, the amd64
# legs run only in the postsubmit `isla-main`, and only `isla-main`
# installs sail, isla-sail, git and ca-certificates-bundle and allows
# github.com (on its amd64 legs). A package carrying the x86 model would
# bring them back to the presubmit.
#
# isla, isla-snapshots, sail and isla-sail are pinned to the builds the
# jobs were checked with (verus/ISLA.md, "Setup"). rust-1.98 is
# Dockerfile.dev's stream; build-base is build.rs's C++ compiler and
# isla-check's linker; llvm-21 gives llvm-objdump and llvm-ar.
version: 1

environment:
  packages:
    - isla~0.1.0_git20260923
    - isla-snapshots~0_git20260602
    - z3~4.16
    - rust-1.98
    - build-base
    - llvm-21
    - make
    - busybox

checks:
  isla:
    description: >-
      make isla on arm64 natively, at quantum 16 and at quantum 8: the asm
      templates and the Isla seams against the ledger, then every aarch64
      Isla job and negative control. Runs on pull requests that change the
      system-call, TLS, pointer-authentication, trap, GOT-function or rseq
      code, the Isla harness, its ledger overrides or the build. The x86_64
      half runs only in isla-main.
    trigger: [presubmit]
    # The files holding the checked asm! blocks (src/sys/raw.rs,
    # src/sys/tls.rs, src/sys/pac.rs, src/sys/mod.rs, src/api/cxx.rs,
    # src/config.rs, src/rseq.rs), the build inputs, the harness
    # (verus/isla/x86/ included), the ledger it reads and this file. A
    # change elsewhere can still move a site's registers (a TLS load or a
    # PAC instruction inlined into new code); isla-main below catches that
    # after the landing.
    when:
      changed:
        - "src/sys/**"
        - "src/api/cxx.rs"
        - "src/config.rs"
        - "src/rseq.rs"
        - "Cargo.toml"
        - "Cargo.lock"
        - "build.rs"
        - "Makefile"
        - "verus/ISLA.md"
        - "verus/seams.sh"
        - "verus/isla/**"
        - "verus/ledger/src/**/*.overrides"
        - ".chainguard/ci/isla.yaml"
    foreach:
      - name: arm64-q16
        vars: {ISLA_TARGETS: aarch64}
      - name: arm64-q8
        vars: {ISLA_TARGETS: aarch64, ISLA_CARGO_FLAGS: "--no-default-features --features quantum8"}
    # The aarch64 half traces 36 PAC instructions in 36 configurations and
    # checks 2,820 PAC jobs, one process per CPU (verus/isla/run-aarch64.sh,
    # section 6): about 18 minutes on medium-arm64's 4 vCPUs, past
    # 15 minutes. large-arm64 doubles the CPUs, and 30 minutes leaves room
    # for a guest held to its 4 reserved cores.
    resources: &isla-resources large-arm64
    timeout: &isla-timeout 30m
    network: &crates
      egress: [index.crates.io, static.crates.io]
    cmd: &isla-cmd [make, isla]

  # Every leg after each landing on main: a change outside the presubmit
  # list can still change the compiled sites, and the amd64 legs run only
  # here. It gates nothing; a failure points at the commit that moved a
  # site out of the jobs' shapes.
  isla-main:
    description: >-
      make isla on main, on each architecture natively, at quantum 16 and
      at quantum 8, after each landing. The amd64 legs fetch
      sail-x86-from-acl2 from github.com to build the x86 model.
    trigger: [postsubmit]
    environment:
      packages:
        - isla~0.1.0_git20260923
        - isla-snapshots~0_git20260602
        - sail~0.20.3
        - isla-sail~0.20.3
        - z3~4.16
        - rust-1.98
        - build-base
        - llvm-21
        - make
        - git
        - busybox
        - ca-certificates-bundle   # git's https fetch of sail-x86-from-acl2
    # A leg can only narrow the check's egress, so the check allows
    # github.com and the arm64 legs drop it: only the amd64 legs fetch
    # sail-x86-from-acl2.
    foreach:
      - name: arm64-q16
        vars: {ISLA_TARGETS: aarch64}
        network: *crates
      - name: arm64-q8
        vars: {ISLA_TARGETS: aarch64, ISLA_CARGO_FLAGS: "--no-default-features --features quantum8"}
        network: *crates
      # The x86_64 half has no PAC jobs: about 6 minutes on medium-amd64
      # with the x86 model build, most of it the GOT, TLS and rseq::symbols
      # jobs, so medium-amd64 and 15 minutes.
      - name: amd64-q16
        resources: medium-amd64
        timeout: 15m
        vars: {ISLA_TARGETS: x86_64}
      - name: amd64-q8
        resources: medium-amd64
        timeout: 15m
        vars: {ISLA_TARGETS: x86_64, ISLA_CARGO_FLAGS: "--no-default-features --features quantum8"}
    resources: *isla-resources
    timeout: *isla-timeout
    network:
      egress: [index.crates.io, static.crates.io, github.com]
    cmd: *isla-cmd

  # make emptyasm (verus/emptyasm/run.sh) checks the host architecture's
  # empty-template register hints of verus/emptyasm/blocks.txt, then its
  # `-n` negative test copies the tree with git ls-files (hence git) and
  # must see a `nop` in each template fail the check. The blocks of
  # src/api/mod.rs and src/class/table.rs are aarch64-only, those of
  # src/heap/shared.rs and src/layout/regions.rs x86_64-only, so both
  # architectures run. It needs none of the Isla packages.
  emptyasm:
    description: >-
      make emptyasm on each architecture natively, at quantum 16 and at
      quantum 8: the listed empty-template asm! blocks of that architecture
      add no instruction to the release build's assembly or object code,
      no other asm! block holds a comment, and a nop added to each listed
      template fails the check. Runs on pull requests that change src/,
      the harness or the build.
    trigger: [presubmit]
    environment: &emptyasm-env
      packages: [rust-1.98, build-base, llvm-21, make, git, busybox]
    # Every asm! block in the crate's assembly is checked (each must come
    # from an `asm!(` line, and only the listed ones may hold a comment),
    # so any file under src/ can fail it. Also the build inputs, the
    # harness and this file.
    when:
      changed:
        - "src/**"
        - "Cargo.toml"
        - "Cargo.lock"
        - "build.rs"
        - "Makefile"
        - "verus/emptyasm/**"
        - ".chainguard/ci/isla.yaml"
    foreach: &emptyasm-legs
      - {name: arm64-q16, resources: medium-arm64, vars: {QUANTUM: "16"}}
      - {name: arm64-q8, resources: medium-arm64, vars: {QUANTUM: "8"}}
      - {name: amd64-q16, resources: medium-amd64, vars: {QUANTUM: "16"}}
      - {name: amd64-q8, resources: medium-amd64, vars: {QUANTUM: "8"}}
    timeout: 15m
    network: *crates
    cmd: &emptyasm-cmd [make, emptyasm]

  # The same after each landing on main. It gates nothing.
  emptyasm-main:
    description: >-
      make emptyasm on main, on each architecture natively, at quantum 16
      and at quantum 8, after each landing.
    trigger: [postsubmit]
    environment: *emptyasm-env
    foreach: *emptyasm-legs
    timeout: 15m
    network: *crates
    cmd: *emptyasm-cmd
