# The test cells, on every pull request. The kernel floor (5.14, with a
# 5.10 tripwire below it) has its own checks in floor.yaml.
#
#   linux        `make test` in the Wolfi dev container, {x86_64, aarch64} x
#                quantum {16, 8}, plus the GLIBC <= 2.44 readelf assertion
#   privileged   `make test` privileged (seccomp off, host cgroupns, rw
#                cgroupfs) per arch; the features line must show mseal=yes
#
# Each cell runs ci/cell.sh in a guest with a Docker daemon: it builds
# Dockerfile.dev's `test` stage, then drives the Makefile's container
# targets unchanged, the memory-limited cgroup containers included. Every
# cell compares its SKIP lines with ci/expected-skips/<cell>.txt
# (ci/skip-summary.sh): a new skip fails it. A failing unit test fails it
# too unless ci/known-failures.txt lists it (each entry a TODO).
version: 1

environment:
  packages: [bash, make, git, build-base, coreutils]
  services: [docker]

checks:
  linux:
    description: >-
      make test (release build, the jemalloc-compat stage, both cargo test
      groups and the cgroup-limit, churn and lazy containers) in the Wolfi
      dev container on x86_64 and aarch64 at quantum 16 and 8, with the
      GLIBC <= 2.44 and built-quantum assertions and the expected-skips
      comparison.
    foreach:
      - {name: amd64-q16, resources: medium-amd64, vars: {QUANTUM: "16"}}
      - {name: amd64-q8, resources: medium-amd64, vars: {QUANTUM: "8"}}
      - {name: arm64-q16, resources: medium-arm64, vars: {QUANTUM: "16"}}
      - {name: arm64-q8, resources: medium-arm64, vars: {QUANTUM: "8"}}
    timeout: 45m
    network: &build
      egress:
        # The wolfi-base image of Dockerfile.dev; cgr.dev redirects blob
        # reads to its R2 bucket.
        - cgr.dev
        - 9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com
        - apk.cgr.dev           # apk add in the Dockerfile.dev stages (wolfi-base's repository)
        - packages.wolfi.dev
        - index.crates.io       # cargo fetches libc
        - static.crates.io
    cmd: [bash, ci/cell.sh, linux]

  privileged:
    description: >-
      make test in a privileged container (seccomp off, host cgroup
      namespace, read-write cgroupfs) on x86_64 and aarch64, so the
      privilege-gated tests (mseal, the cgroup writes) run; the features
      line must show mseal=yes.
    foreach:
      - {name: amd64, resources: medium-amd64}
      - {name: arm64, resources: medium-arm64}
    timeout: 45m
    network: *build
    cmd: [bash, ci/cell.sh, privileged]
