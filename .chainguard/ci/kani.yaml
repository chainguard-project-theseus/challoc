# Kani: the bounded model-checking harnesses (cfg(kani) only;
# verus/README.md, "Kani") of src/kani/ and of the kani_* modules in
# other files, each checking a seam of verus/ledger/ against the contract
# Verus assumes. They run under both quanta, since
# `report::base_slab_sizes_returns` reads `BASE_CLASSES`, whose length
# is NCLASSES.
#
# The kani package is pinned to the release the harnesses were checked
# with. It brings the rust stream its kani-compiler is built against
# (rust-1.99, so this file installs no rust-1.98) and kissat, the solver
# `fig_mul_exact` and `set_listed_contract` select; cbmc is pinned to the
# release Kani 0.68.0 was tested with. build-base is build.rs's C++
# compiler. cargo kani takes no --locked, so `cargo fetch --locked` holds
# the run to Cargo.lock first.
# `--ignore-global-asm` because api/libc.rs and sys/tls.rs hold
# `global_asm!` (symbol aliases and the TLS slot) that no harness reaches;
# `-Z stubbing` for the harnesses that replace a call with a model
# (`kani::stub`; `git grep -n 'kani::stub' src` lists them);
# `-Z mem-predicates`
# for `kani::mem`'s `can_dereference` and its kin, with which harnesses
# check what Kani 0.68 does not check on a typed access: the alignment and
# the validity of the value. `-j 4` runs four harnesses at once, on
# xlarge-amd64 for its 64 GiB: CBMC peaks at 11.6 GiB on
# `config::kani_config::display_bytes`, 10.8 GiB on
# `kani_proofs::misc::formatter_write_fmt` and 8.8 GiB on
# `kani_proofs::slice::slice_is_sorted` (quantum 16), 31.2 GiB together,
# which leaves less than 1 GiB of large-amd64's 32 GiB for a fourth.
version: 1

environment:
  packages: [kani~0.68.0, cbmc~6.11.0, build-base, busybox]

checks:
  kani:
    description: >-
      cargo kani over every harness (src/kani/ and the kani_* modules of
      other files), at quantum 16 and at quantum 8: each must verify. Runs
      on pull requests that change src/kani/, src/vspec/, a file in its
      changed: list, or this file.
    trigger: [presubmit]
    # On pull requests that change src/kani/, a specification its harnesses
    # check, a file with an in-source kani_* module that hot proof lanes
    # rarely touch, or this file; other pull requests do not plan the check.
    # The files most proof pull requests touch (src/heap/cache.rs,
    # src/purge.rs, and any later kani_* module in a hot file) are covered by
    # kani-ignoring below instead, after each landing, so presubmit doesn't
    # pay for Kani on every proof round. Items outside both (src/stats.rs,
    # the zero axioms of src/class/table.rs, the class table in
    # src/layout/, the enums src/kani/eq.rs matches) are checked by
    # kani-ignoring too.
    when:
      changed:
        - "src/kani/**"
        - "src/vspec/**"
        - "src/api/cxx.rs"
        - "src/api/jemalloc.rs"
        - "src/api/print.rs"
        - "src/config.rs"
        - "src/heap/slotstate.rs"
        - "src/heap/tcaches.rs"
        - "src/huge/table.rs"
        - "src/layout/regions.rs"
        - "src/rseq.rs"
        - "src/slab.rs"
        - "src/sys/cgroup.rs"
        - "src/sys/mod.rs"
        - ".chainguard/ci/kani.yaml"
    foreach:
      - {name: q16, vars: {QUANTUM: "16"}}
      - {name: q8, vars: {QUANTUM: "8"}}
    resources: xlarge-amd64
    # The harnesses (`git grep '#\[kani::proof\]' src | wc -l` counts them)
    # take about 40 min per quantum at -j 4 here.
    timeout: 60m
    network: &kani-net
      egress: [index.crates.io, static.crates.io]
    steps:
      - name: fetch the locked dependencies
        cmd: [cargo, fetch, --locked]
      - name: harnesses
        cmd:
          - sh
          - -c
          - >-
            cargo kani -Z unstable-options -Z stubbing -Z mem-predicates --ignore-global-asm
            --output-format terse -j 4
            --no-default-features --features "quantum${QUANTUM:?}"

  # Every harness, one at a time in regular format, after each landing on
  # main: covers the kani_* modules in files the presubmit trigger leaves
  # out and the checked items outside any listed path, and fails when a
  # harness does not verify (ci/kani-regular.sh exits with cargo kani's
  # status). Kani 0.68.0 with CBMC 6.11.0 leaves `<`, `<=`, `>` and
  # `>=` on two non-constant bools unconstrained (CBMC prints
  # `warning: ignoring >=` and the harness can pass vacuously), and the
  # terse output `-j` requires hides that warning. ci/kani-regular.sh fails
  # on it; scripts/kani-boolcmp.sh (the lint check) is the presubmit half.
  # In regular format the harnesses take about 75 min per quantum one at a
  # time, past one job's timeout, so each quantum runs as 4 shards that
  # split them by the script's table of seconds:
  # `formatter_write_fmt` alone (about 21 min) and three of about 18 min.
  # large-amd64's 32 GiB holds CBMC's 11.6 GiB peak with one harness at
  # a time. It gates nothing.
  kani-ignoring:
    description: >-
      Every harness on main in regular format with CBMC's verbose output,
      at quantum 16 and at quantum 8, in 4 shards each, after each landing:
      each must verify, and CBMC must print no `warning: ignoring` line (an
      ordering comparison on bools it could not encode).
    trigger: [postsubmit]
    foreach:
      - {name: q16-1, vars: {QUANTUM: "16", SHARD: "1"}}
      - {name: q16-2, vars: {QUANTUM: "16", SHARD: "2"}}
      - {name: q16-3, vars: {QUANTUM: "16", SHARD: "3"}}
      - {name: q16-4, vars: {QUANTUM: "16", SHARD: "4"}}
      - {name: q8-1, vars: {QUANTUM: "8", SHARD: "1"}}
      - {name: q8-2, vars: {QUANTUM: "8", SHARD: "2"}}
      - {name: q8-3, vars: {QUANTUM: "8", SHARD: "3"}}
      - {name: q8-4, vars: {QUANTUM: "8", SHARD: "4"}}
    vars: {SHARDS: "4"}
    resources: large-amd64
    timeout: 40m
    network: *kani-net
    steps:
      - name: fetch the locked dependencies
        cmd: [cargo, fetch, --locked]
      - name: harnesses, regular format
        cmd: [sh, -c, 'sh ci/kani-regular.sh "${SHARD:?}" "${SHARDS:?}"']
