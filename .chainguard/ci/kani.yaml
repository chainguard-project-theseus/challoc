# Kani: the bounded model-checking harnesses of src/kani/ (cfg(kani) only;
# verus/README.md, "Kani"), each checking a seam of verus/ledger/ against
# the contract Verus assumes. They run under both quanta, since
# `report::base_slab_sizes_returns` reads `BASE_CLASSES`, whose length
# is NCLASSES.
#
# The kani package is pinned to the release the harnesses were checked
# with. It brings the rust stream its kani-compiler is built against
# (rust-1.99, so this file installs no rust-1.98) and kissat, the solver
# `fig_mul_exact` selects; cbmc is pinned to the release Kani 0.68.0 was
# tested with. build-base is build.rs's C++ compiler. cargo kani takes no
# --locked, so `cargo fetch --locked` holds the run to Cargo.lock first.
# `--ignore-global-asm` because api/libc.rs and sys/tls.rs hold
# `global_asm!` (symbol aliases and the TLS slot) that no harness reaches;
# `-Z stubbing` for the abort harnesses, which stub
# `sys::abort::abort_fmt` (its body ends in raw syscalls, inline assembly
# Kani does not run). `-j 4` runs four harnesses at once.
version: 1

environment:
  packages: [kani~0.68.0, cbmc~6.11.0, build-base, busybox]

checks:
  kani:
    description: >-
      cargo kani over every harness in src/kani/, at quantum 16 and at
      quantum 8: each must verify. Runs on pull requests that change
      src/kani/, src/vspec/ or this file.
    trigger: [presubmit]
    # Only on pull requests that change a harness, a specification it
    # checks or this file; other pull requests do not plan the check. The
    # items the harnesses check live outside these paths (src/stats.rs,
    # src/sys/abort.rs, src/layout/, the enums src/kani/eq.rs matches), so
    # a change to one of them is checked only when a later pull request
    # touches src/kani/ (src/kani/mod.rs).
    when:
      changed:
        - "src/kani/**"
        - "src/vspec/**"
        - ".chainguard/ci/kani.yaml"
    foreach:
      - {name: q16, vars: {QUANTUM: "16"}}
      - {name: q8, vars: {QUANTUM: "8"}}
    resources: large-amd64
    timeout: 40m
    network:
      egress: [index.crates.io, static.crates.io]
    steps:
      - name: fetch the locked dependencies
        cmd: [cargo, fetch, --locked]
      - name: harnesses
        cmd:
          - sh
          - -c
          - >-
            cargo kani -Z unstable-options -Z stubbing --ignore-global-asm
            --output-format terse -j 4
            --no-default-features --features "quantum${QUANTUM:?}"
