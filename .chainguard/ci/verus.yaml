# Verus: every proof holds, the verified share of challoc stays at or
# above verus/FLOOR, and verus/ledger/ is current. All three are `make
# verus` (verus/README.md): `sh verus/seams.sh --check`, then `cargo
# verus verify`, then verus/count --floor, which also compares
# verus/FLOOR with the base revision's copy; verus/FLOOR's header says
# when its figures rise and when one may be lowered.
#
# The verus package is pinned to the release whose vstd Cargo.toml pins
# (bump both together), and it brings the rust stream (rust-1.99) and
# z3 that release runs with, so this file installs no rust-1.98: the two
# cannot be installed together. The package has no aarch64 cross target
# (`--target aarch64-unknown-linux-gnu`), so `verus-arm64` runs the same
# steps natively on an arm64 runner, so Verus also checks the code behind
# `cfg(target_arch = "aarch64")`. git reads the
# base revision's verus/FLOOR; build-base is build.rs's C++ compiler.
version: 1

environment:
  packages: [verus~0.2026.10.18, build-base, busybox, make, git]

checks:
  verus:
    description: >-
      make verus: the seam ledger check (verus/ledger/), cargo verus
      verify over challoc, then verus/count's tests and its coverage floor
      (verus/FLOOR, against the pull request's base); then cargo verus
      verify of the quantum-8 build; then the not-Copy control
      (verus/notcopy-control.sh) under the package's rust stream.
    trigger: [presubmit]
    resources: large-amd64
    timeout: 45m
    network: &crates
      egress: [index.crates.io, static.crates.io]
    steps:
      - &counter-tests
        name: counter tests
        cmd: [cargo, test, --locked, --manifest-path, verus/count/Cargo.toml]
      - &verus-step
        name: seam ledger, proofs and coverage floor
        cmd:
          - sh
          - -c
          # Checks sets the base on every pull request run
          # (CHAINGUARD_BASE_REVISION, a reserved variable); a run without
          # one fails rather than skip the comparison.
          - make verus VERUS_BASE="${CHAINGUARD_BASE_REVISION:?no base revision to compare verus/FLOOR with}"
      - &verus-q8
        name: proofs at quantum 8
        # The quantum-8 build (`--features quantum8`) has its own class
        # table, so its proofs are checked too.
        cmd: [cargo, verus, verify, --locked, --no-default-features, --features, quantum8]
      - name: not-Copy control
        # The not-Copy checks of src/vspec/notcopy.rs hold only while
        # rustc rejects their ambiguous impls; lint.yaml's
        # notcopy-control shows that for rust-1.98, and this step for
        # the rust stream the verus package brings.
        cmd: [sh, verus/notcopy-control.sh]

  # The same on aarch64: the package's arm64 build, run natively.
  verus-arm64:
    description: >-
      make verus on aarch64, natively: the seam ledger check, cargo verus
      verify over the aarch64 build of challoc, and the coverage floor;
      then the quantum-8 build.
    trigger: [presubmit]
    resources: large-arm64
    timeout: 45m
    network: *crates
    steps:
      - *counter-tests
      - *verus-step
      - *verus-q8

  # On main, squash-merged, the commit before the one under test is the
  # base; verus/count fails when it does not resolve.
  verus-main:
    description: >-
      make verus on main: the seam ledger check, the proofs and the coverage
      floor, against the commit before this one; then the quantum-8
      build, so two pull requests that each pass alone cannot break the
      quantum-8 proofs on main unseen.
    trigger: [postsubmit]
    resources: large-amd64
    timeout: 45m
    network: *crates
    steps:
      - *counter-tests
      - name: seam ledger, proofs and coverage floor
        cmd: [make, verus, VERUS_BASE=HEAD^]
      - *verus-q8
