# Verus and Kani: every proof holds, every Kani harness passes, and the
# checked shares of the shipped crates stay at or above verus/FLOOR. The
# verus checks first run `make verus-headers`, which holds the port's
# copies of the kit's Verus files (this one among them) to the installed
# templates' headers, so a header that drifts fails here rather than at
# the next kit bump. Then they run `make verus` (verus/README.md):
# `cargo verus focus` over challoc (the Makefile's VERUS_MODE makes it
# `cargo verus verify` of cargo's default package), then the kit counter
# (verus-count, from the theseus-proved-port package) with --floor, which
# compares verus/FLOOR with the base revision's copy, so that lowering a
# figure needs a new `lowered` line, and holds each function's rlimit use
# to verus/RLIMIT.
# When a figure rises, and what a `lowered` line needs, is verus/FLOOR's
# header's rule. The kani checks are `make kani`: the kit's kani.sh,
# from the same package, over every harness of the crates KANI_CRATES
# names (a foreach of KANI_ONLY, KANI_HARNESS or KANI_SHARD splits them;
# kani.sh's header says how). The two share nothing, so they are
# separate checks that run at once.
#
# Every run compares with a base, and none skips it, and both checks take
# the one Checks sets (CHAINGUARD_BASE_REVISION). On a pull request,
# verus takes the pull request's base. On main, verus-main takes the
# start of the push the run covers: Checks settles a burst of pushes into
# one run at the last, and names as its base the tip its previous run
# planned (when that is a first-parent ancestor, else the first parent).
# HEAD^ would be the merge before the last one, and a merge inside the
# burst would never be compared with main before it. Where
# verus/FLOOR exists, `make verus` passes `--base-rev "$(VERUS_BASE)"` to
# the counter and fails when VERUS_BASE is empty; it never prints SKIP and
# passes, since a run that skips the comparison lets FLOOR fall on main
# unseen.
#
# Shape: one architecture, arm64, on large-arm64 (8 vCPU, 32 GiB), with a
# 60-minute timeout for verus and 30 minutes for kani. Verus's result
# does not depend on the guest's architecture unless the proved code
# does, so one is the default. A port whose proved code differs by
# target (`cfg(target_arch)`, pointer width, page size) runs the proofs
# on both, as challoc does: uncomment verus-amd64 below. A port whose
# proofs outgrow the timeout moves up a class (to xlarge-arm64, say) and
# says why here.
#
# Every check here is in the port from its first commit: Checks refuses
# a change that deselects a check its run selects, so the set only grows
# (kit/templates/README.md, "The required Verus check set"). verus and
# verus-main pass at FLOOR 0.0 before the first proof. `make kani` fails
# when it finds no harness to run, so until the first harness the
# port's Makefile sets `KANI_NONE = yes`, under which it passes with
# none and fails with any; the first harness deletes that line. A port
# that will never discharge a seam with Kani leaves Kani out from its
# first commit: no kani or kani-main, no `kani~0.68.0` in the
# packages here or in the development sessions' environment, and no Kani
# in the toolchain entry of .chainguard/deps.yaml.
#
# verus is pinned to the release the workspace's vstd pin names
# (Cargo.toml; bump both together, and the development sessions'
# environment's), and it brings the rust stream and z3 that release runs
# with. kani is pinned to the release the Kani records under verus/seams/
# name, built against the same rust stream. theseus-proved-port is pinned
# to the kit release the Makefile's PROVED_PORT_VERSION names (bump both
# together, and the development sessions' environment's). The development
# sessions' environment is .chainguard/develop.yaml, or the file its
# `from:` names. git reads the base revision's verus/FLOOR.
# VERUS_THREADS gives Verus every vCPU of the guest (CG_CPUS), one z3
# per module.

# challoc: the checks keep the names and triggers main ran before the
# kit, since Checks refuses a change whose base would run a check its
# head does not. So `verus` (x86_64, large-amd64) and `verus-arm64`
# (aarch64, natively on large-arm64) are the two architectures, with no
# verus-amd64, and `verus-main` runs on main; Kani stays in
# .chainguard/ci/kani.yaml as `kani` and `kani-ignoring`, with no
# kani-main. The verus package has no aarch64 cross target, so
# `verus-arm64` runs natively, and Verus checks the code behind
# `cfg(target_arch = "aarch64")` there; verus/count.toml's `verus_sets`
# names both architectures. The timeouts stay 45 minutes.
#
# `make verus` first checks the seam ledger (the Makefile's verus-seams:
# `sh verus/seams.sh --check`), and the counter holds each function's
# rlimit use on that architecture to verus/RLIMIT. The quantum-8 build
# (`--features quantum8`) has its own class table, so its proofs run too
# (the Makefile's verus-q8), and the counter holds their rlimit use to
# verus/RLIMIT as well. The verus package brings the rust stream
# (rust-1.99, which lint.yaml and Dockerfile.dev pin too), so this file
# installs no rust of its own. build-base is build.rs's C++ compiler.
version: 1

environment:
  packages: [verus~0.2026.11.02, theseus-proved-port~0.4.0, build-base, busybox, make, git]

checks:
  verus:
    description: >-
      make verus-headers, then make verus: the seam ledger check
      (verus/ledger/), cargo verus verify over challoc on x86_64, and the
      kit counter's coverage floor (verus/FLOOR) against the pull
      request's base; then the proofs of the quantum-8 build; then the
      not-Copy control (verus/notcopy-control.sh) under the package's
      rust stream.
    trigger: [presubmit]
    resources: large-amd64
    timeout: 45m
    network: &crates
      egress: [index.crates.io, static.crates.io]
    steps:
      - &headers-step
        name: Verus file headers
        cmd: [make, verus-headers]
      - &verus-step
        name: seam ledger, proofs and coverage floor
        cmd:
          - sh
          - -c
          # Checks sets the base on every run, a pull request's and
          # main's (CHAINGUARD_BASE_REVISION, a reserved variable); a run
          # without one fails rather than skip the comparison. verus-main
          # runs this same step.
          - make verus VERUS_THREADS="${CG_CPUS:-}" VERUS_BASE="${CHAINGUARD_BASE_REVISION:?no base revision to compare verus/FLOOR with}"
      - &verus-q8
        name: proofs at quantum 8
        # The Makefile's verus-q8: make verus-proofs with the quantum-8
        # features, statistics to target/verus-stats-q8.json, then the
        # counter over them (verus/RLIMIT), against the same base.
        cmd: [sh, -c, 'make verus-q8 VERUS_THREADS="${CG_CPUS:-}" VERUS_BASE="${CHAINGUARD_BASE_REVISION:?no base revision to compare verus/RLIMIT with}"']
      - name: not-Copy control
        # The not-Copy checks of src/vspec/notcopy.rs hold only while
        # rustc rejects their ambiguous impls; lint.yaml's
        # notcopy-control shows that for lint's rust stream, and this
        # step for the one the verus package brings (both rust-1.99).
        cmd: [make, notcopy-control]

  # The same on aarch64: the package's arm64 build, run natively.
  verus-arm64:
    description: >-
      make verus-headers, then make verus on aarch64, natively: the seam
      ledger check, cargo verus verify over the aarch64 build of challoc,
      and the coverage floor against the pull request's base; then the
      proofs of the quantum-8 build.
    trigger: [presubmit]
    resources: large-arm64
    timeout: 45m
    network: *crates
    steps:
      - *headers-step
      - *verus-step
      - *verus-q8

  # On main, the base is the start of the push the run covers, which
  # Checks sets as for a pull request; the counter fails when it does not
  # resolve. This check must fail, never SKIP, when it has no base to
  # compare verus/FLOOR with.
  verus-main:
    description: >-
      make verus-headers, then make verus on main: the seam ledger check,
      the proofs and the coverage floor, against main before the push
      this run covers; then the proofs of the quantum-8 build, so two pull
      requests that each pass alone cannot break them on main unseen.
    trigger: [postsubmit]
    resources: large-amd64
    timeout: 45m
    network: *crates
    steps:
      - *headers-step
      - *verus-step
      - *verus-q8
