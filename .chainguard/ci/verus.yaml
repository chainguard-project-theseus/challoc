# Verus: every proof holds, the verified share of challoc stays at or
# above verus/FLOOR, and verus/SEAMS.md is current. All three are `make
# verus` (verus/README.md): `sh verus/seams.sh --check`, then `cargo
# verus verify`, then verus/count --floor, which also compares
# verus/FLOOR with the base revision's copy so that lowering it needs a
# stated reason. FLOOR rises in its own pull requests between merges, to the
# figures the step's output names.
#
# The verus package is pinned to the release whose vstd Cargo.toml pins
# (bump both together), and it brings the rust stream (rust-1.99) and
# z3 that release runs with, so this file installs no rust-1.98: the two
# cannot be installed together. The check runs on x86_64 only: the package has no
# aarch64 cross target (`--target aarch64-unknown-linux-gnu`); the
# package's arm64 build verifies natively (verus/README.md). git reads the
# base revision's verus/FLOOR; build-base is build.rs's C++ compiler.
version: 1

environment:
  packages: [verus~0.2026.10.18, build-base, busybox, make, git]

checks:
  verus:
    description: >-
      make verus: the seam ledger check (verus/SEAMS.md), cargo verus
      verify over challoc, then verus/count's tests and its coverage floor
      (verus/FLOOR, against the pull request's base).
    trigger: [presubmit]
    resources: large-amd64
    timeout: 45m
    network: &crates
      egress: [index.crates.io, static.crates.io]
    steps:
      - &counter-tests
        name: counter tests
        cmd: [cargo, test, --locked, --manifest-path, verus/count/Cargo.toml]
      - name: seam ledger, proofs and coverage floor
        cmd:
          - sh
          - -c
          # Checks sets the base on every pull request run
          # (CHAINGUARD_BASE_REVISION, a reserved variable); a run without
          # one fails rather than skip the comparison.
          - make verus VERUS_BASE="${CHAINGUARD_BASE_REVISION:?no base revision to compare verus/FLOOR with}"

  # On main, squash-merged, the commit before the one under test is the
  # base; verus/count fails when it does not resolve.
  verus-main:
    description: >-
      make verus on main: the seam ledger check, the proofs and the coverage
      floor, against the commit before this one.
    trigger: [postsubmit]
    resources: large-amd64
    timeout: 45m
    network: *crates
    steps:
      - *counter-tests
      - name: seam ledger, proofs and coverage floor
        cmd: [make, verus, VERUS_BASE=HEAD^]
