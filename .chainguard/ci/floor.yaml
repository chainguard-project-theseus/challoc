# The kernel floor: challoc supports host kernels 5.14 and newer
# (CONTRIBUTING.md, "Support scope"), and a 5.10 tripwire below the floor
# is run for information. Each check launches GCE VMs on public
# distribution images through `cb launch exp-floor` (ci/floor.sh,
# bench/README.md) and runs the floor-test row on this commit: `make test`
# (the cgroup steps in child cgroups under the privileged container
# profile) and `make fuzz`.
#
#   floor      AlmaLinux 9 (5.14), x86_64 and aarch64, default and
#              privileged containers
#   tripwire   Debian 11 (5.10), x86_64: below the floor, informational
#
# Both hold the challoc-gce identity (identities.yaml), which can create
# VMs in the bench project, so they run only where the identity is
# released: pushes to main (postsubmit). Pull requests never run them, so
# no pull request needs the credential and no check reads the pull
# request's context.
version: 1

environment:
  packages:
    - python-3.13        # bench/cb (3.11+)
    - google-cloud-sdk
    - git                # cb bundles the commit with git archive
    - bash
    - coreutils
    - findutils
    - grep

checks:
  floor:
    description: >-
      make test and make fuzz on AlmaLinux 9's 5.14 kernel (the supported
      floor), x86_64 and aarch64, in default and privileged containers, on
      GCE VMs launched by cb. Runs on pushes to main.
    trigger: [postsubmit]
    identity: challoc-gce
    # The service account ci/floor.sh impersonates; the identity's
    # principal may impersonate it and nothing else.
    vars: &floor-vars
      FLOOR_SA: challoc-floor@dlorenc-dev.iam.gserviceaccount.com
    timeout: 50m
    network: &gce
      egress:
        # STS, Compute and Storage; the egress proxy releases the sealed
        # identity token only to these.
        - "*.googleapis.com"
    cmd: [bash, ci/floor.sh, "fl-alma9-x86,fl-alma9-x86-p,fl-alma9-arm,fl-alma9-arm-p"]

  # Off: it failed on every landing (68 of 68; the Checks log ends at "cb
  # launch: no samples came back") because the Debian 11 bench image it
  # boots is stale and cannot reach crates.io, so it said nothing about
  # the 5.10 kernel. `when: {requested: true}` on a postsubmit-only check
  # turns it off outright: a postsubmit run carries no requested set, and
  # `chainctl checks run` plans presubmit checks only. Once the image is
  # rebuilt (#463), delete the `when:` line below to turn it back on.
  tripwire:
    when: {requested: true}
    advisory: true
    description: >-
      make test and make fuzz on Debian 11's 5.10 kernel, below the
      supported floor, on a GCE VM launched by cb. Informational: a break
      here is noticed, not a promise. Off until its bench image is rebuilt
      (#463; see the comment above it in floor.yaml).
    trigger: [postsubmit]
    identity: challoc-gce
    vars: *floor-vars
    timeout: 50m
    network: *gce
    cmd: [bash, ci/floor.sh, fl-deb11-x86]
