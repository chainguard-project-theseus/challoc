# Lint, on every pull request: rustfmt, clippy with -D warnings (which
# also fails the build on any rustc warning), the ctest-cc.sh cache race
# test, the loom models, shellcheck, the codegen-fncmp fixtures, the Kani
# bool-comparison lint and the bench harness's unit tests all block.
# msrv-build builds the shipped cdylib with the rust-version toolchain.
# loom-count, the slow loom count model, blocks too but runs only on pull
# requests that change what it models.
# The toolchains run in the guest directly, no container.
version: 1

environment:
  packages:
    - rust-1.98        # rustc, cargo, rustfmt and clippy; Dockerfile.dev's stream
    - build-base       # cc and g++ for build.rs (src/api/cxx_handler.cpp)
    - bash
    - curl             # ci/shellcheck.sh fetches the pinned release
    - git              # ci/shellcheck.sh lists the scripts with git ls-files
    - xz
    - patch            # tests/loom/run.sh applies the loom DPOR patch

checks:
  rustfmt:
    description: >-
      cargo fmt --check over the crate. CI requires it; run `cargo fmt`
      before committing.
    timeout: 5m
    cmd: [cargo, fmt, --check]

  clippy:
    description: >-
      cargo clippy -D warnings over the shipped no_std library (release) and
      over every target, tests included, at quantum 16 and 8. Any clippy or
      rustc warning fails it.
    resources: medium
    timeout: 20m
    network: &crates
      egress: [index.crates.io, static.crates.io]
    steps:
      - name: clippy (shipped library, no_std)
        cmd: [cargo, clippy, --release, --, -D, warnings]
      - name: clippy (tests)
        cmd: [cargo, clippy, --all-targets, --, -D, warnings]
      - name: clippy (quantum 8, every target)
        cmd: [cargo, clippy, --all-targets, --no-default-features, --features, quantum8, --, -D, warnings]

  ctest-cc-race:
    description: >-
      tests/ctest-cc-race.sh: concurrent scripts/ctest-cc.sh --quantum calls
      on a cold cache all exit 0 with the built library's quantum and leave
      no temporary file behind.
    resources: medium
    timeout: 15m
    network: *crates
    steps:
      - name: build
        cmd: [cargo, build, --release]
      - name: concurrent callers
        cmd: [sh, tests/ctest-cc-race.sh]

  loom:
    description: >-
      The loom models of the atomics protocols (tests/loom, its own crate):
      cargo fmt --check, then tests/loom/run.sh, which checks Cargo.lock
      and runs cargo test --release under loom 0.7.2 with the DPOR patch
      (tests/loom/loom-0.7.2-dpor.patch); the slow count model is ignored
      here and runs in loom-count. Worth a look on any change to the
      atomics a model copies (tests/loom/tests/pins.rs).
    resources: medium
    timeout: 20m
    network: *crates
    steps:
      - name: rustfmt (tests/loom)
        cmd: [cargo, fmt, --check, --manifest-path, tests/loom/Cargo.toml]
      - name: loom models
        cmd: [sh, tests/loom/run.sh]

  # count::loom_count_bind_assign_unbind took about 6 of the loom check's
  # 7 minutes, so it is #[ignore]d there and runs here, on pull requests
  # that change the loom crate, the code the count model copies (the
  # Arenas counts of src/arena.rs, the RawLock of src/lock.rs
  # (tests/loom/src/lock.rs), and src/heap/mod.rs, whose try_rehome calls
  # try_bind_idle without a lock: tests/loom/src/count.rs,
  # tests/loom/tests/pins.rs), or the code it runs: vspec/count.rs's
  # wrappers, over the atomics of src/sync.rs. The pins in `loom` still
  # fail on every pull request that changes a copied line. `--ignored`
  # runs every ignored model, so a later slow one belongs in this list's
  # paths too.
  loom-count:
    description: >-
      The loom count model with the shipped orderings
      (count::loom_count_bind_assign_unbind, ignored in the loom check):
      tests/loom/run.sh -- --ignored, under loom 0.7.2 with the DPOR patch.
      Runs on pull requests that change tests/loom/, the arena counts and
      lock the model copies, or the wrappers it runs and src/sync.rs.
    when:
      changed:
        - "tests/loom/**"
        - "src/arena.rs"
        - "src/lock.rs"
        - "src/vspec/count.rs"
        - "src/sync.rs"
        - "src/heap/mod.rs"
        - ".chainguard/ci/lint.yaml"
    resources: medium
    timeout: 20m
    network: *crates
    cmd: [sh, tests/loom/run.sh, --, --ignored]

  shellcheck:
    description: >-
      shellcheck (pinned upstream release) over every *.sh file git
      tracks (ci/shellcheck.sh).
    timeout: 5m
    network:
      egress:
        - github.com
        # The release download redirects here.
        - release-assets.githubusercontent.com
        - objects.githubusercontent.com
    cmd: [sh, ci/shellcheck.sh]

  codegen-fncmp:
    description: >-
      ci/codegen-fncmp-test.sh: the 16 fixture checks of
      scripts/codegen-fncmp.py on the dump pairs in
      scripts/testdata/codegen-fncmp, each pair's verdict line against the
      expected one; the crate-hash and impl-disambiguator pairs run with
      c++filt hidden from PATH and the crate-hash pair also with it.
    environment:
      packages: [python-3.13, busybox, binutils]
    timeout: 5m
    cmd: [sh, ci/codegen-fncmp-test.sh]

  kani-boolcmp:
    description: >-
      ci/kani-boolcmp-test.sh: scripts/kani-boolcmp.sh over src/ and its
      fixtures. No ordering comparison (<, <=, >, >=) on bools, or on
      tuples and structs holding one, in Kani code: CBMC 6.11 ignores
      them (`warning: ignoring >=`) and the harness can pass vacuously.
      The positive control scripts/testdata/kani-boolcmp/probe.rs, on
      which CBMC prints that warning, must be flagged.
    environment:
      packages: [busybox]
    timeout: 5m
    cmd: [sh, ci/kani-boolcmp-test.sh]

  bench-unit:
    description: >-
      The bench harness's unit tests (bench/cb/tests: stats, planner,
      parsers, report), `make bench-unit`. Standard library only, no VMs
      or network; the launch planner's tests resolve HEAD with git.
    environment:
      packages: [python-3.13, git, busybox]
    timeout: 5m
    cmd: [sh, -c, "cd bench && python3 -m unittest discover -s cb/tests -t ."]

  msrv-build:
    description: >-
      cargo build --release of the shipped cdylib with the rust-version
      toolchain (Cargo.toml, 1.94).
    environment:
      packages: [rust-1.94, build-base]
    resources: medium
    timeout: 15m
    network: *crates
    cmd: [cargo, build, --release]
