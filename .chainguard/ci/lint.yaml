# Lint, on every pull request: rustfmt, clippy with -D warnings (which
# also fails the build on any rustc warning), the loom models, shellcheck,
# the codegen-fncmp fixtures, the Kani bool-comparison lint and the bench
# harness's unit tests all block. msrv-build builds the shipped cdylib with
# the rust-version toolchain. The toolchains run in the guest directly, no
# container.
version: 1

environment:
  packages:
    - rust-1.98        # rustc, cargo, rustfmt and clippy; Dockerfile.dev's stream
    - build-base       # cc and g++ for build.rs (src/api/cxx_handler.cpp)
    - bash
    - curl             # ci/shellcheck.sh fetches the pinned release
    - xz
    - patch            # tests/loom/run.sh applies the loom DPOR patch

checks:
  rustfmt:
    description: >-
      cargo fmt --check over the crate. CI requires it; run `cargo fmt`
      before committing.
    timeout: 5m
    cmd: [cargo, fmt, --check]

  clippy:
    description: >-
      cargo clippy -D warnings over the shipped no_std library (release) and
      over every target, tests included. Any clippy or rustc warning fails
      it.
    resources: medium
    timeout: 20m
    network: &crates
      egress: [index.crates.io, static.crates.io]
    steps:
      - name: clippy (shipped library, no_std)
        cmd: [cargo, clippy, --release, --, -D, warnings]
      - name: clippy (tests)
        cmd: [cargo, clippy, --all-targets, --, -D, warnings]

  loom:
    description: >-
      The loom models of the atomics protocols (tests/loom, its own crate):
      cargo fmt --check, then tests/loom/run.sh, which checks Cargo.lock
      and runs cargo test --release under loom 0.7.2 with the DPOR patch
      (tests/loom/loom-0.7.2-dpor.patch). Worth a look on any change to
      the atomics a model copies (tests/loom/tests/pins.rs).
    resources: medium
    timeout: 20m
    network: *crates
    steps:
      - name: rustfmt (tests/loom)
        cmd: [cargo, fmt, --check, --manifest-path, tests/loom/Cargo.toml]
      - name: loom models
        cmd: [sh, tests/loom/run.sh]

  shellcheck:
    description: >-
      shellcheck (pinned upstream release) over every shell script in the
      tree: ci/, verus/, scripts/, tests/, bench/ and the CI services
      (ci/shellcheck.sh).
    timeout: 5m
    network:
      egress:
        - github.com
        # The release download redirects here.
        - release-assets.githubusercontent.com
        - objects.githubusercontent.com
    cmd: [sh, ci/shellcheck.sh]

  codegen-fncmp:
    description: >-
      ci/codegen-fncmp-test.sh: scripts/codegen-fncmp.py on the dump pairs
      in scripts/testdata/codegen-fncmp. An AArch64 offset-0 load against
      the same load at a nonzero offset must count as reloc-only, and a
      post-indexed load as changed.
    environment:
      packages: [python-3.13, busybox]
    timeout: 5m
    cmd: [sh, ci/codegen-fncmp-test.sh]

  kani-boolcmp:
    description: >-
      ci/kani-boolcmp-test.sh: scripts/kani-boolcmp.sh over src/ and its
      fixtures. No ordering comparison (<, <=, >, >=) on bools, or on
      tuples and structs holding one, in Kani code: CBMC 6.11 ignores
      them (`warning: ignoring >=`) and the harness can pass vacuously.
      The positive control scripts/testdata/kani-boolcmp/probe.rs, on
      which CBMC prints that warning, must be flagged.
    environment:
      packages: [busybox]
    timeout: 5m
    cmd: [sh, ci/kani-boolcmp-test.sh]

  bench-unit:
    description: >-
      The bench harness's unit tests (bench/cb/tests: stats, planner,
      parsers, report), `make bench-unit`. Standard library only, no VMs
      or network.
    environment:
      packages: [python-3.13, busybox]
    timeout: 5m
    cmd: [sh, -c, "cd bench && python3 -m unittest discover -s cb/tests -t ."]

  msrv-build:
    description: >-
      cargo build --release of the shipped cdylib with the rust-version
      toolchain (Cargo.toml, 1.94).
    environment:
      packages: [rust-1.94, build-base]
    resources: medium
    timeout: 15m
    network: *crates
    cmd: [cargo, build, --release]
